<!DOCTYPE html>
<html lang="en">
<head>  
<style> 
.weather-body {
display: flex;    
justify-content: center;
align-items: center;
flex-direction: column;
height: 100vh;
font-family: Arial, Helvetica, sans-serif
}

.weather-page {
background-color: white;
border: 2px solid grey;
padding: 10px;
margin: 10px;
height: 800px;
width: 500px;
}

.weather-manchester {
border: 2px solid lightgray; background-color: lightgray;
border-radius: 5px;
padding: 2px;
margin-bottom: 10px;
}

.weather-edinburgh {
border: 2px solid lightgray; background-color: lightgray;
border-radius: 5px;
margin-bottom: 10px;
}

.weather-bristol {
border: 2px solid lightgray; background-color: lightgray;
border-radius: 5px;
margin-bottom: 10px;   
}

.weather-york {
border: 2px solid lightgray; background-color: lightgray;
border-radius: 5px; 
margin-bottom: 20px;  
}

.info-button {
display: flex;
justify-content: center;
align-items: center;
font-size: 30px;
background-color: navy;
color: white;
height: 90px;

}

    </style> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Page</title>
</head>

<body style="background-color:powderblue;">


<div class="weather-body">

            <img src="./img/mooncloud.png" width="50px" height="50px">

        </div>

        <div class="weather-york">
